<!DOCTYPE html>
<html>
<head>
  <title>Game Hub</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
      color: white;
    }

    /* Top menu */
    #menu {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: #111;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 10px;
      z-index: 10;
    }

    button {
      background: #222;
      color: white;
      border: none;
      padding: 8px 14px;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background: #00b3ff;
      color: black;
    }

    /* Loader overlay */
    #loader {
      position: fixed;
      top: 50px;
      left: 0;
      right: 0;
      bottom: 0;
      background: black;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 5px solid #333;
      border-top: 5px solid #00b3ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Iframe */
    iframe {
      position: absolute;
      top: 50px;
      left: 0;
      width: 100%;
      height: calc(100% - 50px);
      border: none;
    }
  </style>
</head>

<body>

  <!-- Menu -->
  <div id="menu">
    <strong>🎮 Game Hub</strong>
    <button onclick="loadGame('escape')">Escape Road City 2</button>
    <button onclick="loadGame('crazy')">CrazyGames</button>
    <button onclick="loadGame('az')">AZGames</button>
  </div>

  <!-- Loader -->
  <div id="loader">
    <div class="spinner"></div>
  </div>

  <!-- Game Frame -->
  <iframe id="gameFrame"></iframe>

  <script>
    const frame = document.getElementById("gameFrame");
    const loader = document.getElementById("loader");

    function loadGame(game) {
      loader.style.display = "flex";

      if (game === "escape") {
        frame.src = "https://escaperoadcity2.io";
      }

      if (game === "crazy") {
        frame.src = "https://www.crazygames.com";
      }

      if (game === "az") {
        frame.src = "https://azgames.io";
      }
    }

    frame.addEventListener("load", () => {
      loader.style.display = "none";
    });
  </script>

</body>
</html>
